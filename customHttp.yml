customHeaders:
  - pattern: '**/*'
    headers:
      # ── Prevent MIME sniffing ─────────────────────────────────────────────
      - key: X-Content-Type-Options
        value: nosniff

      # ── Block clickjacking ────────────────────────────────────────────────
      - key: X-Frame-Options
        value: DENY

      # ── Don't leak full URLs to third-party services ──────────────────────
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin

      # ── Disable unused browser APIs ───────────────────────────────────────
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()

      # ── Force HTTPS for 1 year (browser-level enforcement) ───────────────
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains

      # ── Content Security Policy ───────────────────────────────────────────
      # Allows: Stripe (payments), Vimeo (landing video), Google Fonts,
      # QuickBooks/Xero/Wave/FreshBooks APIs, Web3Forms (contact form),
      # Mailchimp (newsletter), app.taxstat360.com (backend API), and the Meta
      # (Facebook) advertising pixel.
      #
      # FIX (fresh-pass audit, Aug 2026): the Meta Pixel (index.html's deferred,
      # consent-gated loader -- see pixelConsent.test.js) loads
      # https://connect.facebook.net/en_US/fbevents.js and reports events to
      # https://www.facebook.com/tr -- neither domain was listed here, a real
      # gap between this source file and the site's actual, intended behavior
      # (the pixel is a deliberate, disclosed, consent-gated feature per
      # Privacy.jsx, not something that should've needed an undocumented
      # allowance). Listed explicitly below rather than relying on img-src's
      # broad `https:` catch-all, since the pixel's script tag and its
      # tracking beacon are governed by script-src/connect-src, not img-src.
      #
      # FIX (fresh-pass audit, Aug 2026, finding M-7): 'unsafe-inline' and
      # 'unsafe-eval' dropped from script-src. A repo-wide scan found zero use
      # of dangerouslySetInnerHTML, innerHTML, or eval() anywhere in the
      # codebase, so unsafe-eval was pure unused risk. The one genuinely
      # inline script (the pixel loader above, in index.html) is a static,
      # unchanging block, so a nonce (which needs a server to mint one per
      # request -- not available on this static CloudFront/S3 site) isn't the
      # right tool; a SHA-256 hash of that exact script's content is the
      # standard replacement for a static site and is listed below instead.
      # MAINTENANCE NOTE: if the inline pixel-loader script in index.html
      # (the block containing `window.__ts360LoadPixel = function`) is EVER
      # edited -- even whitespace -- this hash must be recomputed or the
      # pixel will silently stop loading (CSP blocks it, no console error
      # beyond a CSP violation report). Recompute with:
      #   node -e "const fs=require('fs');const html=fs.readFileSync('index.html','utf8');const m='window.__ts360LoadPixel = function';const i=html.indexOf(m);const s=html.lastIndexOf('<script>',i)+8;const e=html.indexOf('</script>',i);const c=html.slice(s,e);console.log('sha256-'+require('crypto').createHash('sha256').update(c,'utf8').digest('base64'))"
      #
      # IMPORTANT: Test first by temporarily changing the key above to:
      #   Content-Security-Policy-Report-Only
      # Check the browser console for any violations, fix them, then switch
      # back to the enforcing header name below.
      - key: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' 'sha256-JDkn9a3LuxhlkDKGUUjQEh+1Lr1h4eNAZJnyw9ARJmU=' https://js.stripe.com https://connect.facebook.net;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data: https: blob:;
          connect-src 'self'
            https://app.taxstat360.com
            wss://app.taxstat360.com
            https://api.stripe.com
            https://quickbooks.api.intuit.com
            https://api.xero.com
            https://api.wave.com
            https://api.freshbooks.com
            https://api.web3forms.com
            https://taxstat360.us4.list-manage.com
            https://www.facebook.com
            https://connect.facebook.net;
          frame-src https://js.stripe.com https://hooks.stripe.com https://player.vimeo.com;
          worker-src 'self' blob:;
          object-src 'none';
          base-uri 'self';
          form-action 'self' https://app.taxstat360.com https://taxstat360.us4.list-manage.com;
          upgrade-insecure-requests;
