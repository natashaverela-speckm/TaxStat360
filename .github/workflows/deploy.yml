name: CI — tests and build

# ── FRESH-EYES R-3 (11 Sep 2026): this workflow no longer deploys ────────────
#
# It used to be called "Build and Deploy to S3" and, on every push to master,
# synced dist/ to s3://taxstat360-deploy-1775348133433 and invalidated CloudFront
# distribution EJQTM04C80LWI. The H13 note this replaces set out the ambiguity —
# two pipelines, two header configurations, and which one served production was
# "not known from this repo". It has now been established from the AWS console:
#
#   www.taxstat360.com            -> AMPLIFY, branch master (Amplify-managed TLS,
#                                    status Available). This is the live site.
#   dqvm0qrewsa6n.cloudfront.net  -> EJQTM04C80LWI, the target of this workflow.
#                                    No alternate domain names. Nothing in the
#                                    product points at it: the app calls
#                                    API_BASE_URL = https://app.taxstat360.com.
#
# So case (b) of the old note applied: this job deployed to an origin that is not
# production, and the header check could only ever have gone green by reading a
# site this job did not deploy. That is why SITE_URL was never set — setting it
# would have bought a green tick and no information.
#
# Worse than useless, it was actively harmful. EJQTM04C80LWI carries NO response
# headers policy on any of its three behaviours, so that second copy served no
# CSP, no HSTS, no X-Frame-Options, no X-Content-Type-Options and no
# Referrer-Policy — while proxying /auth/* and /integrations/* to the real
# apigw-taxstat360 origin, so sign-in worked there. Standard logging is Off, so
# nothing was recorded. Every push republished it, current with production.
#
# Amplify is the deploy path (amplify.yml runs `npm run test` in preBuild, so the
# same gate still blocks a red suite from deploying). This workflow keeps the part
# that was always worth having — tests and a build check on every push and PR, so
# a commit still carries a pass/fail mark — and does nothing else.
#
# STILL OPEN, and NOT fixable from this repo (owner, AWS console):
#   1. Disable EJQTM04C80LWI, confirm nothing breaks, then delete it and the
#      bucket. Disable before deleting — it has a taxstat360.com certificate
#      attached and its behaviours reference the live API.
#   2. Rotate AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY in this repo's secrets;
#      they are no longer used here and should not keep working.
#   3. Confirm app.taxstat360.com (the API origin the product actually calls)
#      carries its own security headers. It is a different distribution and was
#      never covered by customHttp.yml or by the check removed below.
#
# scripts/assertLiveHeaders.mjs is deliberately KEPT in the repo. It is the only
# thing that reads what is actually served rather than what customHttp.yml says,
# and September's outage was invisible to every other test here. Point it at a
# real target and run it — by hand, or from a workflow that knows what it
# deployed — rather than deleting the one check that would have caught that class
# of failure.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Run vitest test suite. Protects tax calculations and entity scenario
      # logic from silent regressions. Amplify runs this same suite in preBuild,
      # so a red result blocks the actual deploy as well as failing here.
      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
