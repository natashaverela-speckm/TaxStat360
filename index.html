    <!-- Meta Pixel Code — TWO independent gates. Both must pass.
         ============================================================
         GATE 1 (consent): Facebook's script is NOT loaded and NO event fires
         until the visitor clicks Accept on the cookie banner. __ts360LoadPixel
         runs at page load only if consent was granted on a prior visit; the
         banner's Accept handler (App.jsx) calls it on first grant. Choosing
         "Essential only" never loads it.

         GATE 2 (route allowlist) — AUDIT B6, Sep 2026:
         The Privacy Policy represents that the pixel "never runs inside the
         signed-in application." Gate 1 alone did not make that true: once a
         visitor accepted cookies, the pixel followed them into the app, onto
         /signup, and onto /terms and /privacy. /signup collects FULL NAME and
         EMAIL, and Meta's Automatic Advanced Matching scrapes form fields,
         hashes them, and transmits them WITHOUT any developer code — the exact
         2023 H&R Block / TaxAct / TaxSlayer fact pattern that produced §7216
         criminal referrals.

         __ts360PixelAllowed is an ALLOWLIST: a new route is excluded by default
         and must be added deliberately. It is duplicated (small, deliberate) from
         src/lib/complianceCopy.js — isPixelAllowedPath() — because this script
         runs before the bundle loads. src/pixelConsent.test.js pins the two
         copies together; if you change one, change both.

         Also: fbq('set','autoConfig',false,PIXEL_ID) is issued BEFORE init. That
         disables Meta's automatic configuration for this pixel, which is what
         turns off Automatic Advanced Matching and automatic button/form event
         collection client-side. Belt and braces — ALSO turn Advanced Matching
         off in Events Manager; this flag alone is not a substitute. -->
    <script>
      window.__ts360PixelAllowed = function (pathname) {
        var ALLOW = ['/', '/about', '/how-it-works', '/features', '/pricing', '/faq', '/contact', '/resources'];
        var PREFIX = ['/resources/'];
        var p = String(pathname == null ? '' : pathname).replace(/\/+$/, '') || '/';
        if (ALLOW.indexOf(p) !== -1) return true;
        for (var i = 0; i < PREFIX.length; i++) { if (p.indexOf(PREFIX[i]) === 0) return true; }
        return false;
      };
      window.__ts360LoadPixel = function () {
        if (window.__ts360PixelLoaded) return;
        // GATE 2: never load outside the public marketing pages.
        try {
          if (!window.__ts360PixelAllowed(window.location.pathname)) return;
        } catch (e) { return; }
        window.__ts360PixelLoaded = true;
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('set', 'autoConfig', false, '1318925679665526');
        fbq('init', '1318925679665526');
        fbq('track', 'PageView');
      };
      try {
        if (localStorage.getItem('ts360_cookie_consent') === 'accepted') {
          window.__ts360LoadPixel();
        }
      } catch (e) { /* storage blocked: default to NOT loading the pixel */ }
    </script>

    <!-- JSON-LD: FAQPage (matches on-page FAQ content) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Do I need a CPA — and does TaxStat360 replace one?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You don't need a CPA to use TaxStat360 — it's built for business owners, not accountants. You connect your accounting software (or enter your numbers manually), answer a few questions about your filing situation, and the platform handles the calculations. But it isn't a replacement for your CPA, and we don't try to be one: TaxStat360 is a tax planning and estimation tool, not a tax filing service. Think of it as the same year-round visibility your CPA has, available to you 365 days a year. You can share your TaxStat360 dashboard with your CPA to make that relationship more productive."
          }
        },
        {
          "@type": "Question",
          "name": "How accurate are the tax calculations?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "TaxStat360 uses IRS-published tax rates, brackets, and rules for the tax year you select — choose your applicable year from the year dropdown in the Tax Tracker (Step 2 of the calculator) and all calculations update automatically to reflect the correct IRS rates for that year. Our calculations cover federal tax only (state taxes are not included) and encompass: federal income tax, self-employment tax, the §199A QBI deduction, estimated quarterly payments (with safe harbor), K-1 passthrough income, the 3.8% Net Investment Income Tax (NIIT), the 0.9% Additional Medicare Tax, and Alternative Minimum Tax (AMT). Results are designed for accurate planning estimates. For your actual filed return, always review with a tax professional. See \"What does TaxStat360 not calculate?\" below for the modeling boundaries we deliberately leave to your preparer."
          }
        },
        {
          "@type": "Question",
          "name": "What does TaxStat360 not calculate?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "TaxStat360 is a planning estimate, and some things are deliberately left to your preparer — each can make our figure differ from theirs. It does not calculate state, local, or foreign tax. It uses the depreciation figure you enter rather than building a depreciation schedule, so MACRS and §168(k) bonus depreciation are taken as you or your accountant computed them; a §179 amount you enter separately from a K-1 is checked against that year’s dollar cap, the investment phase-out, and the business-income limit, but the depreciation field itself is not. It does not apply the §163(j) business-interest limitation. It takes HSA and SEP or Solo 401(k) contributions as entered without capping them at the annual limits. It does not ask your age, so the senior deduction is not applied, and it does not model the deductions for tips, overtime, or car-loan interest. For C-Corporations it assumes the full annual profit is distributed, and it does not model the accumulated-earnings tax (§531) or the personal-holding-company tax (§541). A passive partner’s or passive S-Corp shareholder’s K-1 share is handled — a positive share for NIIT and passive-loss netting, and a passive K-1 LOSS is suspended under §469 except to the extent of your passive income, with the remainder carried forward, and last year’s unallowed loss from that activity can be entered on its Step 1 card (Form 8582 line 2c). A full release on disposition of the interest (§469(g)) is not modeled. Several of these are flagged inside the app at the field they affect."
          }
        },
        {
          "@type": "Question",
          "name": "What accounting software does TaxStat360 connect to?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "TaxStat360 integrates with QuickBooks Online, Xero, Wave, and FreshBooks. Connect your account and we pull your profit and loss totals automatically — no manual data entry needed. If you don't use one of these platforms, or prefer not to connect, you can enter your gross receipts and expenses directly in the calculator. Manual entry takes under 2 minutes and gives you the same full analysis. More integrations are coming soon."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use TaxStat360 if I have multiple businesses?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Entity capacity depends on your plan: Starter covers 1 business plus up to 3 rental properties; Professional covers up to 3 businesses with unlimited rentals; and Enterprise covers unlimited businesses and rentals, with a consolidated federal tax view across all of them in one place."
          }
        },
        {
          "@type": "Question",
          "name": "Is my financial data secure?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We take it seriously. TaxStat360 encrypts your data with AES-256 at rest and TLS 1.2+ in transit, and connects to your accounting software using read-only OAuth tokens. We never have access to move or modify your money. No system can guarantee absolute security, and any company that tells you otherwise is overselling. Your financial data is never sold and is never shared with third parties for advertising or marketing purposes. It is shared only with the service providers that power the product itself — payment processing, secure cloud hosting, your connected accounting software, and our AI processor for AI-powered features — exactly as detailed in our Privacy Policy."
          }
        },
        {
          "@type": "Question",
          "name": "What is the 7-day free trial?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You get full access to all features on your selected plan for 7 days, completely free. You will not be charged until your 7-day trial ends. Cancel anytime in Settings before day 7 and you will never be billed. A payment method is required to activate your trial."
          }
        }
      ]
    }
