version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node --version
        - npm install
        # M4 / incident 2026-07-06: Amplify auto-deployed builds that failed the
        # test suite (the GitHub Actions S3 path correctly blocked them). Run the
        # full vitest suite here so BOTH deploy paths share the same gate — a red
        # test now stops the Amplify deploy too, including the CI-enforced
        # architecture-invariants.test.js checks.
        - npm run test
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  # ── AUDIT H13 (second launch audit, Sep 2026): customHeaders REMOVED ──
  #
  # This file used to define a second customHeaders block on the same '**/*'
  # pattern as customHttp.yml, with X-Frame-Options: SAMEORIGIN (contradicting
  # customHttp.yml's DENY), no CSP and no HSTS. Which one applied was decided by
  # the platform, not by anyone here — the production site happened to serve the
  # customHttp.yml set, which is the safe outcome, arrived at by luck.
  #
  # customHttp.yml is now the ONLY place headers are defined, cache rules
  # included. Do not reintroduce a customHeaders block here; a CI guard
  # (src/customHttp.csp.test.js) fails the build if one appears.
